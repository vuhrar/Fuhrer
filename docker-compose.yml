services:
  fulaw:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FUHRER_DATA_DIR: /data
      FULAW_PRIVATE_MODE: "true"
    volumes:
      - fulaw_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  fulaw_data:
